name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Verify and package DevPanel
        shell: pwsh
        run: ./tools/build-windows-release.ps1 -SkipInstall
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevPanel-windows-x64
          path: release/DevPanel-*-windows-x64/**
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/DevPanel-*-windows-x64/*.msi
            release/DevPanel-*-windows-x64/*-setup.exe
            release/DevPanel-*-windows-x64/*-portable.zip
            release/DevPanel-*-windows-x64/SHA256SUMS.txt
