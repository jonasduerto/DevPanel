# DevPanel site presets
#
# Syntax: internal-value = Visible label
# Add a line to make it appear in the Add a site selector. Built-in values
# wordpress, laravel, blesta, whmcs and empty receive their native scaffold.
# Any other value creates an editable custom project folder with NOTES.txt.

empty = Empty
wordpress = WordPress
laravel = Laravel
blesta = Blesta
whmcs = WHMCS

# Examples of user-defined presets:
# drupal = Drupal
# symfony = Symfony
# legacy-php = Legacy PHP application
