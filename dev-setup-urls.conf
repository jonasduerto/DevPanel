# DevPanel application and project-source catalog
#
# URLs here are sources only. Downloads, credentials, and license acceptance
# are explicit UI steps; no installation is performed merely by reading this
# file.

[wordpress]
latest_zip = "https://wordpress.org/latest.zip"
releases_page = "https://wordpress.org/download/releases/"
version_7_0_2_zip = "https://wordpress.org/wordpress-7.0.2.zip"

[laravel]
installation_docs = "https://laravel.com/docs/installation"
installer_command = "composer global require laravel/installer"
new_project_command = "laravel new <project-name>"

[whmcs]
download_portal = "https://download.whmcs.com/"
note = "Requires an authenticated customer account and a valid license."

[blesta]
downloads_page = "https://www.blesta.com/downloads/"
client_area = "https://account.blesta.com/client/plugin/download_manager/"
note = "Requires an authenticated customer account and a valid license."

[node]
windows_downloads = "https://nodejs.org/en/download"

[composer]
windows_installer = "https://getcomposer.org/Composer-Setup.exe"

[security]
# Never accept a new version only because a pinned URL still returns a file.
# The installer must verify the vendor-provided checksum/signature, present the
# license where applicable, and use a staging directory before replacing a
# DevPanel/bin tool.
require_integrity_verification = true
allow_silent_install = false
