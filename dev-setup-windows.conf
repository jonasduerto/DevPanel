# DevPanel Windows runtime catalog
#
# This file is declarative: DevPanel must show the selected URL, target folder,
# version, and checksum before it downloads or copies anything.  It must never
# execute the command examples below automatically.
#
# Runtime layout owned by DevPanel:
#   C:\devpanel\bin\php
#   C:\devpanel\bin\apache
#   C:\devpanel\bin\nginx
#   C:\devpanel\bin\mysql
#
# Do not run a server directly from another local application. An explicit
# import may copy selected files into the DevPanel folders above.

[php]
# Official Windows builds. TS is for Apache module use; NTS is for FastCGI.
downloads_page = "https://www.php.net/downloads.php?os=windows"
php_8_5_ts_x64_url = "https://windows.php.net/downloads/releases/php-8.5.8-Win32-vs17-x64.zip"
php_8_5_ts_x64_sha256 = "a7323e50a1e29fddc278d9297ca9a4ec134bd1cca5396af39115284a125cab2f"
target = "bin/php"

[nginx]
# Official Windows archive. Keep both the release URL and its verification key.
downloads_page = "https://nginx.org/en/download.html"
mainline_windows_url = "https://nginx.org/download/nginx-1.31.3.zip"
mainline_signature_url = "https://nginx.org/download/nginx-1.31.3.zip.asc"
target = "bin/nginx"

[apache]
# Apache HTTP Server does not publish official Windows binaries. DevPanel must
# require a user-selected, explicitly approved Windows binary source before it
# imports Apache. Do not silently fetch an unverified third-party package.
source_page = "https://www.apachelounge.com/download/"
target = "bin/apache"

[mysql]
# Keep database downloads on the official MySQL site. Installation requires a
# version-specific checksum and an initialized DevPanel data directory.
source_page = "https://dev.mysql.com/downloads/mysql/"
target = "bin/mysql"

[wp_cli]
# Official WP-CLI build maintained by the WP-CLI project.
phar_url = "https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar"
target = "bin/wp/wp-cli.phar"

[heidisql]
source_page = "https://www.heidisql.com/download.php"
target = "bin/heidisql"

[phpmyadmin]
source_page = "https://www.phpmyadmin.net/downloads/"
target = "bin/phpmyadmin"
# Requires a DevPanel-managed web alias before the UI enables Open phpMyAdmin.

[composer]
windows_installer = "https://getcomposer.org/Composer-Setup.exe"
target = "bin/composer"

[redis]
source_page = "https://github.com/tporadowski/redis/releases"
target = "bin/redis"
config_candidates = "redis.conf,redis.windows.conf"

[memcached]
source_page = "https://github.com/nono303/memcached/releases"
target = "bin/memcached"
config_candidates = "memcached.conf,memcached.ini"

[cmder]
source_page = "https://cmder.app/"
target = "bin/cmder"

[sendmail]
source_page = "https://glob.com.au/sendmail/"
target = "bin/sendmail"
config_candidates = "sendmail.ini,sendmail.exe"

[windows_prerequisites]
vc_redist_x64_url = "https://aka.ms/vs/17/release/vc_redist.x64.exe"

[manual_commands]
# Examples only. The future installer will use a temporary directory, verify
# integrity, then install atomically into DevPanel/bin.
php_extract_example = "Invoke-WebRequest <url> -OutFile php.zip; Expand-Archive php.zip -DestinationPath C:\\devpanel\\bin\\php"
nginx_extract_example = "Invoke-WebRequest <url> -OutFile nginx.zip; Expand-Archive nginx.zip -DestinationPath C:\\devpanel\\bin\\nginx"
